<nav class="navbar">
  <div class="navbar__inner">
    <!-- Logo -->
    <a routerLink="/" class="navbar__brand">
      <span class="navbar__logo">💡</span>
      <span class="navbar__title">VIP</span>
    </a>

    <div class="navbar__spacer"></div>

    <!-- Desktop controls (only on home) -->
    @if (isHome()) {
      <div class="navbar__controls">
        <div class="navbar__search">
          <span class="navbar__search-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
          </span>
          <input [(ngModel)]="searchQuery" (ngModelChange)="onSearch($event)"
            placeholder="Search ideas..." class="navbar__search-input"/>
        </div>
        <div class="navbar__tabs">
          <button class="navbar__tab" [class.navbar__tab--active]="activeFilter() === 'all'" (click)="setFilter('all')">All Ideas</button>
          <button class="navbar__tab" [class.navbar__tab--active]="activeFilter() === 'favorites'" (click)="setFilter('favorites')">⭐ Saved</button>
        </div>
        <button class="btn-new-idea" (click)="showModal.set(true)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          <span class="btn-new-idea__text">New Idea</span>
        </button>
      </div>
    }

    <!-- Theme toggle -->
    <app-theme-toggle />

    <!-- User avatar + menu -->
    @if (auth.currentUser(); as user) {
      <div class="navbar__user">
        <button class="navbar__avatar-btn" (click)="showUserMenu.set(!showUserMenu())" title="{{ user.name }}">
          <div class="avatar" [style.background]="user.avatarColor" style="width:34px;height:34px;font-size:12px;">
            {{ user.avatar }}
          </div>
        </button>
        @if (showUserMenu()) {
          <div class="user-menu">
            <div class="user-menu__info">
              <div class="user-menu__name">{{ user.name }}</div>
              <div class="user-menu__email">{{ user.email }}</div>
            </div>
            <div class="user-menu__divider"></div>
            <button class="user-menu__item user-menu__item--danger" (click)="logout()">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
              </svg>
              Sign Out
            </button>
          </div>
        }
      </div>
    }

    <!-- Mobile hamburger -->
    @if (isHome()) {
      <button class="navbar__hamburger" (click)="mobileMenuOpen.set(!mobileMenuOpen())" aria-label="Menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          @if (mobileMenuOpen()) {
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          } @else {
            <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
          }
        </svg>
      </button>
    }
  </div>

  <!-- Mobile menu -->
  @if (isHome() && mobileMenuOpen()) {
    <div class="navbar__mobile-menu">
      <div class="navbar__search navbar__search--mobile">
        <span class="navbar__search-icon">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </span>
        <input [(ngModel)]="searchQuery" (ngModelChange)="onSearch($event)"
          placeholder="Search ideas..." class="navbar__search-input"/>
      </div>
      <div class="navbar__mobile-row">
        <div class="navbar__tabs">
          <button class="navbar__tab" [class.navbar__tab--active]="activeFilter() === 'all'" (click)="setFilter('all'); mobileMenuOpen.set(false)">All Ideas</button>
          <button class="navbar__tab" [class.navbar__tab--active]="activeFilter() === 'favorites'" (click)="setFilter('favorites'); mobileMenuOpen.set(false)">⭐ Saved</button>
        </div>
        <button class="btn-new-idea" (click)="showModal.set(true); mobileMenuOpen.set(false)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          New Idea
        </button>
      </div>
    </div>
  }
</nav>

@if (showModal()) {
  <app-create-idea-modal (close)="showModal.set(false)" />
}
