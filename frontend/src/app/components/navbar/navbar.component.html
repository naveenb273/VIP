<nav class="navbar">
  <div class="navbar__inner">
    <!-- Logo -->
    <a routerLink="/" class="navbar__brand">
      <span class="navbar__logo">💡</span>
      <span class="navbar__title">VIP - <span class="navbar__sub_title">Volvo Ideas Platform</span></span>
    </a>

    <div class="navbar__spacer"></div>

    <!-- Home action (only on home) -->
    @if (isHome()) {
      <div class="navbar__controls">
        <!-- New Idea -->
        <button class="btn-new-idea" (click)="showModal.set(true)">
          <app-icon name="plus" size="17" />
          <span class="btn-new-idea__text">New Idea</span>
        </button>
      </div>
    }

    <!-- Theme toggle -->
    <app-theme-toggle />

    <!-- Notification bell -->
    @if (auth.currentUser()) {
      <div class="navbar__notif">
        <button class="navbar__notif-btn" (click)="goNotifications()" title="Notifications">
          <app-icon name="bell" size="20" />
          @if (notifs.unreadCount() > 0) {
            <span class="notif-badge">{{ notifs.unreadCount() > 9 ? '9+' : notifs.unreadCount() }}</span>
          }
        </button>
      </div>
    }

    <!-- User avatar + menu -->
    @if (auth.currentUser(); as user) {
      <div class="navbar__user">
        <button class="navbar__avatar-btn" (click)="showUserMenu.set(!showUserMenu())" [title]="user.name">
          <div class="avatar" [style.background]="user.avatarColor" style="width:34px;height:34px;font-size:12px;">
            {{ user.avatar }}
          </div>
        </button>
        @if (showUserMenu()) {
          <div class="user-menu">
            <div class="user-menu__info">
              <div class="avatar" [style.background]="user.avatarColor" style="width:40px;height:40px;font-size:14px;margin-bottom:8px;">
                {{ user.avatar }}
              </div>
              <div class="user-menu__name">{{ user.name }}</div>
              <div class="user-menu__email">{{ user.email }}</div>
            </div>
            <div class="user-menu__divider"></div>
            <button class="user-menu__item" (click)="goProfile()">
              <app-icon name="user" size="14" />
              My Profile
            </button>
            <button class="user-menu__item" (click)="goSaved()">
              <app-icon name="star" size="14" />
              Saved Ideas
            </button>
            <button class="user-menu__item" (click)="goDrafts()">
              <app-icon name="file-text" size="14" />
              My Drafts
            </button>
            @if (auth.isAdmin()) {
              <div class="user-menu__divider"></div>
              <button class="user-menu__item user-menu__item--admin" (click)="goAdmin()">
                <app-icon name="shield" size="14" />
                Admin
              </button>
            }
            <div class="user-menu__divider"></div>
            <button class="user-menu__item user-menu__item--danger" (click)="logout()">
              <app-icon name="logout" size="14" />
              Sign Out
            </button>
          </div>
        }
      </div>
    }

  </div>
</nav>

@if (showModal()) {
  <app-create-idea-modal (close)="showModal.set(false)" />
}
