<div class="login-page">
  <div class="login-card">

    <div class="login-logo">
      <span class="login-logo__icon">💡</span>
      <span class="login-logo__text">VIP</span>
    </div>

    <h1 class="login-title">Sign in to VIP</h1>
    <p class="login-sub">Collaborate on ideas across your organisation</p>

    <div class="login-features">
      <div class="login-feature">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
        Share and discover ideas across your team
      </div>
      <div class="login-feature">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
        Collaborate, comment and request to join ideas
      </div>
      <div class="login-feature">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
        Connect via Microsoft Teams and Outlook
      </div>
    </div>

    <button class="btn-ms-signin" (click)="signIn()">
      <svg width="20" height="20" viewBox="0 0 23 23" fill="none">
        <rect x="1"  y="1"  width="10" height="10" fill="#f25022"/>
        <rect x="12" y="1"  width="10" height="10" fill="#7fba00"/>
        <rect x="1"  y="12" width="10" height="10" fill="#00a4ef"/>
        <rect x="12" y="12" width="10" height="10" fill="#ffb900"/>
      </svg>
      Sign in with Microsoft
    </button>

    <p class="login-note">🔐 Secured by <strong>Microsoft Azure Entra ID</strong></p>
  </div>
</div>
