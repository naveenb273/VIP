<div class="positioner-wrap">
  <!-- Preview frame — drag inside here -->
  <div
    #frame
    class="positioner-frame"
    [class.positioner-frame--dragging]="dragging()"
    (pointerdown)="onPointerDown($event)"
    (pointermove)="onPointerMove($event)"
    (pointerup)="onPointerUp($event)"
    (pointercancel)="onPointerUp($event)"
  >
    <img
      [src]="src"
      alt="cover preview"
      class="positioner-img"
      [style.object-position]="position"
      draggable="false"
    />

    <!-- Crosshair focal-point indicator -->
    <div
      class="positioner-dot"
      [style.left.%]="posX"
      [style.top.%]="posY"
    ></div>

    <!-- Drag hint — fades after first drag -->
    @if (showHint()) {
      <div class="positioner-hint">
        <app-icon name="move" size="16" />
        Drag to reposition
      </div>
    }
  </div>

  <!-- Toolbar row below the preview -->
  <div class="positioner-toolbar">
    <div class="positioner-coords">
      <span class="positioner-coords__label">Position</span>
      <span class="positioner-coords__val">{{ posX }}% × {{ posY }}%</span>
    </div>
    <div class="positioner-toolbar__actions">
      <!-- Reset to centre -->
      <button class="positioner-btn" (click)="positionChange.emit('50% 50%')" title="Reset to centre">
        <app-icon name="alert-circle" size="13" />
        Reset
      </button>
      <!-- Remove cover -->
      <button class="positioner-btn positioner-btn--danger" (click)="remove.emit()" title="Remove cover image">
        <app-icon name="trash" size="13" />
        Remove
      </button>
    </div>
  </div>
</div>
