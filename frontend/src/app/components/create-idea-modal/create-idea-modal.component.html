<div class="modal-overlay" (click)="onOverlayClick($event)">
  <div class="modal">
    <div class="modal__header">
      <h2 class="modal__title">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/>
        </svg>
        Share a New Idea
      </h2>
      <button class="modal__close" (click)="close.emit()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <div class="modal__body">
      <!-- Posting as -->
      @if (currentUser) {
        <div class="posting-as">
          <div class="avatar" [style.background]="currentUser.avatarColor" style="width:32px;height:32px;font-size:12px;">
            {{ currentUser.avatar }}
          </div>
          <div>
            <div class="posting-as__name">{{ currentUser.name }}</div>
            <div class="posting-as__label">Posting as</div>
          </div>
        </div>
      }

      <!-- Cover Image -->
      <div class="form-field">
        <label class="form-label">COVER IMAGE <span class="form-label-hint">(optional, max 5 MB)</span></label>
        @if (coverPreview) {
          <!-- Drag-to-reposition when image is selected -->
          <app-cover-positioner
            [src]="coverPreview"
            [position]="form.coverPosition"
            (positionChange)="form.coverPosition = $event"
            (remove)="removeCover()"
          />
        } @else {
          <label class="cover-upload-zone">
            <input type="file" accept="image/*" (change)="onCoverSelected($event)" style="display:none"/>
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
            </svg>
            <span class="cover-upload-zone__text">Click to upload a cover image</span>
            <span class="cover-upload-zone__hint">PNG, JPG, GIF up to 5 MB</span>
          </label>
        }
      </div>

      <!-- Title -->
      <div class="form-field">
        <label class="form-label">IDEA TITLE</label>
        <input [(ngModel)]="form.title" placeholder="Give your idea a compelling title" class="form-input"/>
      </div>

      <!-- Description -->
      <div class="form-field">
        <label class="form-label">DESCRIPTION</label>
        <textarea [(ngModel)]="form.description"
          placeholder="Describe your idea — the problem it solves, how it works, why it matters..."
          rows="5" class="form-input form-textarea"></textarea>
      </div>

      <!-- Tags -->
      <div class="form-field">
        <label class="form-label">TAGS <span class="form-label-hint">(press Enter to add)</span></label>
        <div class="tags-input-wrap">
          @for (tag of form.tags; track tag) {
            <span class="tag-chip">
              {{ tag }}
              <span class="tag-chip__remove" (click)="removeTag(tag)">×</span>
            </span>
          }
          <input [(ngModel)]="tagInput" (keydown)="onTagKeydown($event)"
            [placeholder]="form.tags.length ? '' : 'AI, Sustainability, Mobile…'" class="tags-input-field"/>
        </div>
      </div>

      <!-- Action buttons -->
      <div class="modal__actions">
        <button class="btn-draft" [disabled]="draftCount >= 5 || drafting" (click)="saveDraft()"
          [title]="draftCount >= 5 ? 'Draft limit reached (max 5)' : 'Save as draft'">
          @if (drafting) {
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" style="animation:spin 0.8s linear infinite">
              <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
            </svg>
            Saving…
          } @else {
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
            </svg>
            Save Draft
          }
          @if (draftCount > 0) { <span class="draft-count">{{ draftCount }}/5</span> }
        </button>
        <button class="btn-post" [disabled]="!isValid() || saving" (click)="post()">
          @if (saving) {
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" style="animation:spin 0.8s linear infinite">
              <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
            </svg>
            Publishing…
          } @else {
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
            Post Idea
          }
        </button>
      </div>
    </div>
  </div>
</div>
